name: PRISM_Tutorial
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - anndata=0.10
  - matplotlib=3.10
  - numpy=1.26
  - pandas=2.2
  - scanpy=1.10
  - scikit-learn=1.6
  - scipy=1.14
  - seaborn=0.13
  - tqdm=4.67
  - jupyterlab=4
  - ipykernel=7
  - opencv
  - pillow
  - r-base=4.3
  - r-mclust=6
  - rpy2=3.5
  - pytorch==2.4.0
  - cpuonly
  - pip:
      - --find-links=https://data.pyg.org/whl/torch-2.4.0+cpu.html
      - torch-geometric==2.7.0
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
