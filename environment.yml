name: PRISM_Tutorial
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools>=68
  - anndata>=0.10,<0.12
  - h5py>=3.10,<4
  - matplotlib>=3.8,<3.11
  - numpy>=1.26,<2.0
  - pandas>=2.1,<2.4
  - scanpy>=1.10,<1.12
  - scikit-learn>=1.6,<1.7
  - scipy>=1.11,<1.15
  - seaborn>=0.13,<0.14
  - tqdm>=4.66,<5
  - jupyterlab>=4,<5
  - ipykernel>=6,<8
  # Required for the mclust-based spatial-domain step used in Tutorial 1.
  - r-base>=4.3,<4.4
  - r-mclust>=6,<7
  - rpy2>=3.5,<3.6
  - pip:
      # The PyPI wheel retains correct package metadata for pip verification.
      - scikit-misc==0.5.2

# PyTorch and PyTorch Geometric are intentionally not pinned here. Install a
# CPU or CUDA-matched stack after environment creation, as documented in README.md.
